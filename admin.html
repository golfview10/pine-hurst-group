<!DOCTYPE html>
<html lang="th" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINEHURST | Admin Console ระบบจัดการข้อมูลห้องพัก</title>
    <link rel="icon" href="image/main/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/modern.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #020617; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-btn.active { background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); }
    </style>
</head>

<body class="text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 right-6 z-50 transform translate-x-32 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-medium"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen w-full flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 mx-auto flex items-center justify-center text-2xl text-white shadow-lg shadow-emerald-900/40 mb-4">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl font-semibold tracking-wide text-white">Pinehurst Admin</h1>
                <p class="text-xs text-slate-400 mt-1 font-light">ระบบจัดการข้อมูลและราคาห้องพักออนไลน์</p>
                <div class="mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/60 text-[11px] text-emerald-400 font-mono">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Firebase: phwillz-web-93065
                </div>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">อีเมลผู้ดูแลระบบ (Admin Email)</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="email" id="loginEmail" required placeholder="admin@phwillz.co.th"
                            class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">รหัสผ่าน (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••"
                            class="w-full bg-slate-900/90 border border-slate-700/80 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition">
                    </div>
                </div>

                <div id="loginError" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl hidden"></div>

                <button type="submit" id="loginBtn"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 text-sm mt-2">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i> กลับสู่หน้าหลักเว็บไซต์
                </a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden initially) -->
    <div id="adminDashboard" class="hidden min-h-screen flex flex-col">

        <!-- Top Header Navigation -->
        <header class="glass-panel sticky top-0 z-40 border-b border-slate-800 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold tracking-wide text-white">Pinehurst Admin</h1>
                        <p class="text-xs text-slate-400 font-light flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                            เชื่อมต่อ: <span id="userEmailBadge" class="text-slate-300"></span>
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <a href="index.html" target="_blank"
                        class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700/50 transition">
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        <span>ดูหน้าเว็บจริง</span>
                    </a>
                    <button onclick="handleLogout()"
                        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 text-xs font-medium border border-rose-500/20 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>ออกจากระบบ</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

            <!-- Dorm Selector Tabs -->
            <div class="mb-8 overflow-x-auto pb-2">
                <div class="flex items-center gap-2 min-w-max p-1.5 glass-panel rounded-2xl">
                    <button onclick="switchDorm('golfview')" id="tab-golfview" class="tab-btn active px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-tree text-emerald-400"></i> Golf View
                    </button>
                    <button onclick="switchDorm('golfcity')" id="tab-golfcity" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fa-solid fa-city text-blue-400"></i> Golf City
                    </button>
                    <button onclick="switchDorm('golfmansion')" id="tab-golfmansion" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fa-solid fa-leaf text-green-400"></i> Golf Mansion
                    </button>
                    <button onclick="switchDorm('maplecity')" id="tab-maplecity" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fa-solid fa-cube text-orange-400"></i> Maple City
                    </button>
                    <button onclick="switchDorm('maplemansion')" id="tab-maplemansion" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fa-solid fa-crown text-teal-400"></i> Maple Mansion
                    </button>
                </div>
            </div>

            <!-- Action Toolbar -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 id="currentDormTitle" class="text-xl font-bold text-white flex items-center gap-2">
                        <span>Golf View Residence</span>
                    </h2>
                    <p class="text-xs text-slate-400 font-light mt-0.5">แก้ไขข้อมูลและราคาห้องพัก ข้อมูลจะอัปเดตไปยังหน้าเว็บจริงทันทีที่บันทึก</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <button onclick="importDefaults()" class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition flex items-center justify-center gap-2" title="ดึงข้อมูลเดิมจากไฟล์เว็บมาใส่ฟอร์ม">
                        <i class="fa-solid fa-rotate text-emerald-400"></i> ดึงข้อมูลเริ่มต้น
                    </button>
                    <button onclick="saveCurrentDorm()" id="saveBtn" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white text-xs font-semibold shadow-lg shadow-emerald-900/40 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
                    </button>
                </div>
            </div>

            <!-- Editor Form Container -->
            <div id="dormEditorForm" class="space-y-6">
                <!-- Dynamically generated fields per dorm -->
            </div>

        </main>
    </div>

    <!-- Scripts: Default Data files for one-click initial sync -->
    <script src="js/golf-view-data.js"></script>
    <script src="js/golf-city-data.js"></script>
    <script src="js/golf-mansion-data.js"></script>
    <script src="js/maple-city-data.js"></script>
    <script src="js/maple-mansion-data.js"></script>

    <!-- Firebase SDK (Modular CDN) -->
    <script type="module">
        import { firebaseConfig } from './js/firebase-config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let currentDormId = 'golfview';
        let currentDormData = {};

        const defaultDataMap = {
            'golfview': window.golfViewData,
            'golfcity': window.golfCityData,
            'golfmansion': window.golfMansionData,
            'maplecity': window.mapleCityData,
            'maplemansion': window.mapleMansionData
        };

        const dormMetadata = {
            'golfview': { name: 'Golf View Residence', icon: 'fa-tree', color: 'emerald' },
            'golfcity': { name: 'Golf City', icon: 'fa-city', color: 'blue' },
            'golfmansion': { name: 'Golf Mansion', icon: 'fa-leaf', color: 'green' },
            'maplecity': { name: 'Maple City', icon: 'fa-cube', color: 'orange' },
            'maplemansion': { name: 'Maple Mansion', icon: 'fa-crown', color: 'teal' }
        };

        // Toast feedback
        window.showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            if (!toast) return;
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white';
            toast.className = `fixed top-6 right-6 z-50 transform transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-medium ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i> <span>${msg}</span>`;
            toast.classList.remove('translate-x-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-x-32', 'opacity-0');
            }, 3500);
        };

        // Auth state listener
        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('loginScreen');
            const adminDashboard = document.getElementById('adminDashboard');
            const emailBadge = document.getElementById('userEmailBadge');

            if (user) {
                if (loginScreen) loginScreen.classList.add('hidden');
                if (adminDashboard) adminDashboard.classList.remove('hidden');
                if (emailBadge) emailBadge.textContent = user.email || 'Admin';
                await loadDorm(currentDormId);
            } else {
                if (loginScreen) loginScreen.classList.remove('hidden');
                if (adminDashboard) adminDashboard.classList.add('hidden');
            }
        });

        // Login Handler
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                const errDiv = document.getElementById('loginError');
                const btn = document.getElementById('loginBtn');

                errDiv.classList.add('hidden');
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...`;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    errDiv.classList.remove('hidden');
                    errDiv.textContent = `เข้าสู่ระบบไม่สำเร็จ: ${err.message}`;
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<span>เข้าสู่ระบบ</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
                }
            });
        }

        // Logout Handler
        window.handleLogout = async () => {
            if (confirm('ต้องการออกจากระบบหรือไม่?')) {
                await signOut(auth);
            }
        };

        // Switch Dorm Tab
        window.switchDorm = async (dormId) => {
            currentDormId = dormId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'text-white'));
            const activeBtn = document.getElementById(`tab-${dormId}`);
            if (activeBtn) activeBtn.classList.add('active', 'text-white');

            const titleEl = document.getElementById('currentDormTitle');
            if (titleEl && dormMetadata[dormId]) {
                titleEl.innerHTML = `<i class="fa-solid ${dormMetadata[dormId].icon} text-${dormMetadata[dormId].color}-400"></i> <span>${dormMetadata[dormId].name}</span>`;
            }
            await loadDorm(dormId);
        };

        // Load Dorm Data from Firestore (or fallback to defaults)
        async function loadDorm(dormId) {
            const container = document.getElementById('dormEditorForm');
            if (!container) return;
            container.innerHTML = `<div class="text-center py-16 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-emerald-400"></i><p class="text-sm">กำลังโหลดข้อมูลโครงการ...</p></div>`;

            try {
                const docRef = doc(db, 'dorms', dormId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentDormData = docSnap.data();
                } else {
                    // Fallback to local default file data
                    currentDormData = Object.assign({}, defaultDataMap[dormId] || {});
                }
            } catch (err) {
                console.warn('Could not read from Firestore, using default data:', err);
                currentDormData = Object.assign({}, defaultDataMap[dormId] || {});
            }

            renderEditorUI(dormId, currentDormData);
        }

        // Render Form Inputs based on data
        function renderEditorUI(dormId, data) {
            const container = document.getElementById('dormEditorForm');
            if (!container) return;

            let html = '';

            // Section 1: Header Titles
            html += `
            <div class="glass-panel p-6 rounded-3xl shadow-xl">
                <h3 class="text-sm font-semibold text-emerald-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-heading"></i> ข้อมูลส่วนหัวหน้าเว็บ (Header)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1.5 font-medium">ชื่อโครงการ (Header Title)</label>
                        <input type="text" id="field_headerTitle" value="${escapeHtml(data.headerTitle || '')}"
                            class="w-full bg-slate-900 border border-slate-700/80 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1.5 font-medium">คำบรรยายสั้น (Header Subtitle)</label>
                        <input type="text" id="field_headerSubtitle" value="${escapeHtml(data.headerSubtitle || '')}"
                            class="w-full bg-slate-900 border border-slate-700/80 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white outline-none">
                    </div>
                </div>
            </div>`;

            // Section 2: Room Cards
            // Extract room types from keys (e.g. roomStandardTitle, roomFanTitle, etc.)
            const roomPrefixes = new Set();
            Object.keys(data).forEach(key => {
                const match = key.match(/^room([A-Za-z0-9]+)(Title|Price|Description|Features)$/);
                if (match) roomPrefixes.add(match[1]);
            });

            if (roomPrefixes.size > 0) {
                html += `
                <div class="glass-panel p-6 rounded-3xl shadow-xl">
                    <h3 class="text-sm font-semibold text-emerald-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-bed"></i> ประเภทห้องพักและราคา (Rooms & Pricing)
                    </h3>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">`;

                roomPrefixes.forEach(roomType => {
                    const titleKey = `room${roomType}Title`;
                    const priceKey = `room${roomType}Price`;
                    const unitKey = `room${roomType}PriceUnit`;
                    const descKey = `room${roomType}Description`;
                    const featKey = `room${roomType}Features`;

                    const title = data[titleKey] || roomType;
                    const price = data[priceKey] || '';
                    const unit = data[unitKey] || 'บาท/เดือน';
                    const desc = data[descKey] || '';
                    const features = Array.isArray(data[featKey]) ? data[featKey] : [];

                    html += `
                    <div class="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                                <span class="font-semibold text-white text-base">${escapeHtml(title)}</span>
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">${roomType}</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">ราคา</label>
                                    <input type="text" id="field_${priceKey}" value="${escapeHtml(price)}"
                                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-400 font-semibold outline-none focus:border-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400 mb-1">หน่วย (เช่น บาท/เดือน)</label>
                                    <input type="text" id="field_${unitKey}" value="${escapeHtml(unit)}"
                                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 outline-none focus:border-emerald-500">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="block text-[11px] text-slate-400 mb-1">คำบรรยายห้องพัก</label>
                                <input type="text" id="field_${descKey}" value="${escapeHtml(desc)}"
                                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-400 mb-1">สิ่งอำนวยความสะดวก (1 บรรทัด = 1 รายการ)</label>
                                <textarea id="field_${featKey}" rows="3"
                                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-300 outline-none focus:border-emerald-500 font-light leading-relaxed">${escapeHtml(features.join('\n'))}</textarea>
                            </div>
                        </div>
                    </div>`;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        // Save Current Dorm to Firestore
        window.saveCurrentDorm = async () => {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...`;

            try {
                // Collect input values
                const updatedData = Object.assign({}, currentDormData);

                // Collect header
                const hTitle = document.getElementById('field_headerTitle');
                if (hTitle) updatedData.headerTitle = hTitle.value.trim();
                const hSub = document.getElementById('field_headerSubtitle');
                if (hSub) updatedData.headerSubtitle = hSub.value.trim();

                // Collect room fields
                document.querySelectorAll('[id^="field_room"]').forEach(input => {
                    const key = input.id.replace('field_', '');
                    if (key.endsWith('Features')) {
                        updatedData[key] = input.value.split('\n').map(s => s.trim()).filter(Boolean);
                    } else {
                        updatedData[key] = input.value.trim();
                    }
                });

                // Write to Firestore document
                const docRef = doc(db, 'dorms', currentDormId);
                await setDoc(docRef, updatedData, { merge: true });

                currentDormData = updatedData;
                window.showToast(`บันทึกข้อมูล ${dormMetadata[currentDormId].name} สำเร็จ!`, 'success');
            } catch (err) {
                console.error(err);
                window.showToast(`เกิดข้อผิดพลาด: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล`;
            }
        };

        // One-click import defaults from JS files
        window.importDefaults = () => {
            if (confirm(`ต้องการดึงข้อมูลเริ่มต้นจากไฟล์ของโครงการนี้หรือไม่? (ข้อมูลที่ยังไม่กดบันทึกจะถูกแทนที่)`)) {
                currentDormData = Object.assign({}, defaultDataMap[currentDormId] || {});
                renderEditorUI(currentDormId, currentDormData);
                window.showToast('ดึงข้อมูลเริ่มต้นเรียบร้อยแล้ว อย่าลืมกด "บันทึกข้อมูล"', 'success');
            }
        };

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
